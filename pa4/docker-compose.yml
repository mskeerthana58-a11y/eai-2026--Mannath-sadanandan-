services:
  mock-pricing:
    build: ./mock-pricing
    container_name: pa4-mock-pricing
    ports:
      - "4100:3000"
    environment:
      PRICING_API_KEY: pa4-pricing-key-2026
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
